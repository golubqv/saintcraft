<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>MyCraft Web</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            color: #fff;
        }

        /*
        =================================================
        ГЛАВНЫЙ ЭКРАН
        =================================================
        */

        #menu {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(80, 180, 90, .15),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #151515,
                    #050505
                );

            z-index: 100;

            transition:
                opacity .35s ease,
                visibility .35s ease;
        }

        #menu.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }

        /*
        =================================================
        КОНТЕЙНЕР
        =================================================
        */

        .menu-box {

            width: min(
                92vw,
                620px
            );

            padding: 45px 35px;

            text-align: center;

            border-radius: 24px;

            background:
                rgba(
                    20,
                    20,
                    20,
                    .82
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .1
                );

            box-shadow:
                0 25px 80px
                rgba(
                    0,
                    0,
                    0,
                    .6
                );

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }

        /*
        =================================================
        ЛОГО
        =================================================
        */

        .logo {

            font-size:
                clamp(
                    42px,
                    10vw,
                    78px
                );

            font-weight:
                900;

            letter-spacing:
                -4px;

            line-height:
                1;

            margin-bottom:
                12px;

            text-shadow:
                0 5px 0 #000,
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    .7
                );
        }

        .logo span {
            color: #72d35d;
        }

        .subtitle {

            color:
                rgba(
                    255,
                    255,
                    255,
                    .55
                );

            font-size: 15px;

            margin-bottom: 35px;
        }

        /*
        =================================================
        КНОПКИ
        =================================================
        */

        .button {

            width: 100%;

            min-height: 58px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    180deg,
                    #75d65d,
                    #4eaa3e
                );

            color: white;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(
                    70,
                    180,
                    70,
                    .25
                );

            transition:
                transform .15s ease,
                filter .15s ease;
        }

        .button:hover {
            filter: brightness(1.08);

            transform:
                translateY(-2px);
        }

        .button:active {
            transform:
                translateY(1px);
        }

        /*
        =================================================
        ВТОРАЯ КНОПКА
        =================================================
        */

        .secondary {

            margin-top: 12px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            box-shadow: none;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );
        }

        /*
        =================================================
        ДИСКЛЕЙМЕР
        =================================================
        */

        .notice {

            margin-top: 28px;

            font-size: 11px;

            line-height: 1.6;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .38
                );
        }

        /*
        =================================================
        ИГРОВОЙ КОНТЕЙНЕР
        =================================================
        */

        #game {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background: #000;

            display: none;

            z-index: 1;
        }

        #game.active {
            display: block;
        }

        /*
        =================================================
        EAGLERCRAFT CONTAINER
        =================================================
        */

        #game_frame {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;
        }

        /*
        =================================================
        ЗАГЛУШКА ДО ПОДКЛЮЧЕНИЯ КЛИЕНТА
        =================================================
        */

        #loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 15px;

            background: #000;

            z-index: 10;

            transition:
                opacity .3s ease;
        }

        #loading.hidden {
            opacity: 0;

            pointer-events: none;
        }

        .loader {

            width: 45px;

            height: 45px;

            border-radius: 50%;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            border-top-color:
                #72d35d;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }

        .loading-text {

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .55
                );
        }

        /*
        =================================================
        МОБИЛЬНЫЕ
        =================================================
        */

        @media (
            max-width: 600px
        ) {

            .menu-box {

                padding:
                    35px 22px;

                border-radius:
                    18px;
            }

            .logo {

                letter-spacing:
                    -3px;
            }

        }

    </style>

</head>


<body>


    <!--
    =====================================================
    ГЛАВНОЕ МЕНЮ
    =====================================================
    -->

    <main id="menu">

        <section class="menu-box">

            <div class="logo">

                My<span>Craft</span>

            </div>


            <div class="subtitle">

                Браузерный Minecraft-клиент

            </div>


            <button
                id="play"
                class="button"
            >

                ▶ Играть

            </button>


            <button
                id="fullscreen"
                class="button secondary"
            >

                ⛶ Полный экран

            </button>


            <div class="notice">

                Это неофициальный проект,
                не связанный с Mojang Studios
                или Microsoft.

                <br>

                Minecraft является товарным знаком
                Mojang Studios / Microsoft.

            </div>

        </section>

    </main>


    <!--
    =====================================================
    ИГРОВОЙ ЭКРАН
    =====================================================
    -->

    <section id="game">

        <div id="game_frame"></div>


        <!--
        Пока настоящий клиент не подключён,
        показываем загрузчик.
        -->

        <div id="loading">

            <div class="loader"></div>

            <div class="loading-text">

                Подготовка игрового клиента...

            </div>

        </div>

    </section>


    <!--
    =====================================================
    JAVASCRIPT
    =====================================================
    -->

    <script>

        const menu =
            document.getElementById(
                "menu"
            );


        const game =
            document.getElementById(
                "game"
            );


        const play =
            document.getElementById(
                "play"
            );


        const fullscreen =
            document.getElementById(
                "fullscreen"
            );


        /*
        ================================================
        КНОПКА ИГРАТЬ
        ================================================
        */

        play.addEventListener(
            "click",
            function () {

                menu.classList.add(
                    "hidden"
                );

                game.classList.add(
                    "active"
                );

            }
        );


        /*
        ================================================
        ПОЛНЫЙ ЭКРАН
        ================================================
        */

        fullscreen.addEventListener(
            "click",
            async function () {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document.documentElement
                            .requestFullscreen();

                    }
                    else {

                        await document.exitFullscreen();

                    }

                }
                catch (error) {

                    console.log(
                        "Fullscreen error:",
                        error
                    );

                }

            }
        );


        /*
        ================================================
        ESC
        ================================================
        */

        document.addEventListener(
            "fullscreenchange",
            function () {

                if (
                    document.fullscreenElement
                ) {

                    fullscreen.textContent =
                        "⛶ Выйти из полного экрана";

                }
                else {

                    fullscreen.textContent =
                        "⛶ Полный экран";

                }

            }
        );

    </script>


</body>

  </html>
